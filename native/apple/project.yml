name: BenchmarkWatcher
options:
  bundleIdPrefix: com.benchmarkwatcher
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  ResearchCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BenchmarkWatcherMac:
    type: application
    platform: macOS
    sources:
      - App
      - Assets.xcassets
      - path: Tests/ResearchCoreTests/Fixtures/report.json
        buildPhase: resources
    dependencies:
      - package: ResearchCore
        product: ResearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benchmarkwatcher.mac
        INFOPLIST_KEY_CFBundleDisplayName: BenchmarkWatcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac.entitlements
  BenchmarkWatcherPhone:
    type: application
    platform: iOS
    sources:
      - App
      - Assets.xcassets
      - path: Tests/ResearchCoreTests/Fixtures/report.json
        buildPhase: resources
    dependencies:
      - package: ResearchCore
        product: ResearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benchmarkwatcher.ios
        INFOPLIST_KEY_CFBundleDisplayName: BenchmarkWatcher
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  BenchmarkWatcherMac:
    build:
      targets:
        BenchmarkWatcherMac: all
  BenchmarkWatcherPhone:
    build:
      targets:
        BenchmarkWatcherPhone: all
